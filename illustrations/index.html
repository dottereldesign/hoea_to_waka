<!DOCTYPE html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Illustrations | Hoea tō Waka</title>
    <meta name="description" content="A collection of subtle, flowing background illustration concepts for Hoea tō Waka.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://www.hoeatowaka.co.nz/illustrations/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hoea tō Waka">
    <meta property="og:locale" content="en_NZ">
    <meta property="og:title" content="Illustrations | Hoea tō Waka">
    <meta property="og:description" content="Subtle background studies shaped by current, direction, shelter, and connection.">
    <meta property="og:url" content="https://www.hoeatowaka.co.nz/illustrations/">
    <meta property="og:image" content="https://www.hoeatowaka.co.nz/assets/hoea-to-waka-social.png">

    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Hoea tō Waka — Strength in Aotearoa">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Illustrations | Hoea tō Waka">
    <meta name="twitter:description" content="A collection of flowing monochrome illustration concepts for Hoea tō Waka.">
    <meta name="twitter:image" content="https://www.hoeatowaka.co.nz/assets/hoea-to-waka-social.png">
    <meta name="theme-color" content="#fcfdfe">
    <script>
      (() => {
        document.documentElement.classList.add("js");
        let theme = "light";
        try {
          const savedTheme = window.localStorage.getItem("hoea-theme");
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="../site.css">
    <link rel="icon" href="../assets/favicon.png" type="image/png">
  </head>
  <body class="page-illustrations">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" data-site-header>
      <a class="site-brand" href="../">
        <img src="../assets/logo-white.svg" alt="" loading="lazy" decoding="async">
        <span class="site-brand-copy">
          <span class="site-brand-name">Hoea tō Waka</span>
          <span class="site-brand-line">Strength in Aotearoa</span>
        </span>
      </a>
      <button
        class="theme-switcher-grid theme-switcher-grid--compact site-theme-toggle"
        type="button"
        aria-label="Switch to dark theme"
        aria-pressed="false"
        data-theme-toggle
      >
        <svg class="orb" aria-hidden="true" viewBox="0 0 20 20">
          <defs>
            <mask id="hoea-crescent-mask" x="0" y="0" width="20" height="20" maskUnits="userSpaceOnUse" style="mask-type: luminance">
              <rect width="20" height="20" fill="white"></rect>
              <circle class="orb-cutout" cx="6.5" cy="10" r="9" fill="black"></circle>
            </mask>
          </defs>
          <circle class="orb-disc" cx="10" cy="10" r="10" mask="url(#hoea-crescent-mask)"></circle>
        </svg>
        <span class="cloud-ball cloud-ball-left" aria-hidden="true"></span>
        <span class="cloud-ball cloud-ball-middle" aria-hidden="true"></span>
        <span class="cloud-ball cloud-ball-right" aria-hidden="true"></span>
        <span class="cloud-ball cloud-ball-top" aria-hidden="true"></span>
        <span class="star star-1" aria-hidden="true"></span>
        <span class="star star-2" aria-hidden="true"></span>
        <span class="star star-3" aria-hidden="true"></span>
        <span class="star star-4" aria-hidden="true"></span>
      </button>
      <button class="site-menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="site-navigation" aria-expanded="false" data-menu-toggle>
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-site-nav>
        <a class="site-nav-link" href="../">Home</a>
        <a class="site-nav-link" href="../about/">About</a>
        <div class="site-nav-dropdown" data-nav-dropdown>
          <a class="site-nav-parent-link site-nav-services-link" href="../services/" aria-haspopup="true" aria-controls="services-subnav">Services <span class="site-services-arrow" aria-hidden="true">→</span></a>
          <div class="site-subnav" id="services-subnav" role="group" aria-label="Services">
            <a href="../services/in-house-workshops/">In-house Workshops</a>
            <a href="../services/resilience-one-on-one/">Resilience One on One</a>
            <a href="../services/workshops-for-support-professionals/">Workshops for Support Professionals</a>
          </div>
        </div>
        <a class="site-nav-link" href="../resources/">Resources</a>
        <a class="site-nav-link" href="../contact/">Contact</a>
      </nav>
    </header>

    <main class="site-main" id="main-content">
      <section class="illustration-library" aria-labelledby="illustration-library-title">
        <div class="container">
          <header class="illustration-library-head" data-reveal>
            <p class="eyebrow">Visual language</p>
            <h1 id="illustration-library-title">Illustrations</h1>
            <p>Subtle background studies shaped by current, direction, shelter, and connection.</p>
          </header>

          <ol class="illustration-grid">
            <li class="illustration-card" data-reveal style="--reveal-delay: 30ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-01-rising-current.png" width="720" height="720" alt="Three flowing ribbons rising together" fetchpriority="high"></div>
                <figcaption><span>01</span><h2>Rising Current</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 75ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-02-guiding-light.png" width="720" height="720" alt="A guiding star above two flowing currents" fetchpriority="high"></div>
                <figcaption><span>02</span><h2>Guiding Light</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 120ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-03-layered-horizon.png" width="720" height="720" alt="Three gently layered horizon lines"></div>
                <figcaption><span>03</span><h2>Layered Horizon</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 30ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-04-sheltered-harbour.png" width="720" height="720" alt="A curved shelter embracing two waves" loading="lazy" decoding="async"></div>
                <figcaption><span>04</span><h2>Sheltered Harbour</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 75ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-05-shared-current.png" width="720" height="720" alt="Two flowing paths meeting and continuing together" loading="lazy" decoding="async"></div>
                <figcaption><span>05</span><h2>Shared Current</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 120ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-06-unfurling-path.png" width="720" height="720" alt="A broad path unfurling in a gentle spiral" loading="lazy" decoding="async"></div>
                <figcaption><span>06</span><h2>Unfurling Path</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 30ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-07-mountain-passage.png" width="720" height="720" alt="An open current travelling between two landforms" loading="lazy" decoding="async"></div>
                <figcaption><span>07</span><h2>Mountain Passage</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 75ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-08-rooted-connection.png" width="720" height="720" alt="Flowing branches joining into one rooted form" loading="lazy" decoding="async"></div>
                <figcaption><span>08</span><h2>Rooted Connection</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 120ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-09-steady-centre.png" width="720" height="720" alt="A calm centre held between two curved forms" loading="lazy" decoding="async"></div>
                <figcaption><span>09</span><h2>Steady Centre</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 30ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-10-turning-tide.png" width="720" height="720" alt="Three currents turning together" loading="lazy" decoding="async"></div>
                <figcaption><span>10</span><h2>Turning Tide</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 75ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-11-protective-arc.png" width="720" height="720" alt="Two protective arcs above one calm wave" loading="lazy" decoding="async"></div>
                <figcaption><span>11</span><h2>Protective Arc</h2></figcaption>
              </figure>
            </li>
            <li class="illustration-card" data-reveal style="--reveal-delay: 120ms">
              <figure>
                <div class="illustration-card-media"><img src="../assets/illustrations/illustration-12-open-water.png" width="720" height="720" alt="Four currents widening toward open space" loading="lazy" decoding="async"></div>
                <figcaption><span>12</span><h2>Open Water</h2></figcaption>
              </figure>
            </li>
          </ol>
        </div>
      </section>
    </main>

    <script src="../site.js"></script>
  </body>
</html>
