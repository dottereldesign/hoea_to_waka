#trail #cross-second {animation-duration:400ms;animation-delay:3350ms;}
@keyframes draw {0% {stroke-dashoffset:1;opacity:0;} 1% {opacity:1;} 100% {stroke-dashoffset:0;opacity:1;}}
@media(prefers-reduced-motion:reduce){#trail path {animation:none;stroke-dashoffset:0;opacity:1;}}
</style>
