<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 1402" width="1122" height="1402" role="img" aria-labelledby="title desc">
  <title id="title">A conversation in chairs</title>
  <desc id="desc">Four people sit in blue armchairs around three coloured cards. One person gestures as the others listen, framed by concentric circles of sunlight.</desc>
