  </defs>
  <style>
    /* Reveal the smallest disc first, then expand outwards. People remain still. */
    #sunlight > * { transform-box: view-box; transform-origin: 558px 435px; animation: sun-arrive 1300ms cubic-bezier(.22,.68,.25,1) both; }
    #sunlight [data-part="centre"] { animation-delay: 100ms; }
    #sunlight [data-part="peach"] { animation-delay: 340ms; }
    #sunlight [data-part="amber"] { animation-delay: 580ms; }
    #sunlight [data-part="outer"] { animation-delay: 820ms; }
    @keyframes sun-arrive {
      0% { opacity: 0; transform: scale(.68); }
      48% { opacity: 1; transform: scale(1.035); }
      73% { opacity: 1; transform: scale(.988); }
      100% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { #sunlight > * { animation: none; } }
  </style>
