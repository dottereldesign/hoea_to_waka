<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Hoea tō Waka — Strength in Aotearoa</title>
  <desc id="description">Social sharing card for Hoea tō Waka resilience training and resources.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b202d"/>
      <stop offset="0.58" stop-color="#173b55"/>
      <stop offset="1" stop-color="#365f8d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 80) rotate(135) scale(590 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73acd1" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#73acd1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow)"/>
  <circle cx="1075" cy="555" r="230" fill="#c9e6f5" opacity="0.08"/>
  <circle cx="1090" cy="552" r="142" fill="#c9e6f5" opacity="0.07"/>
  <image href="logo-white.svg" x="86" y="130" width="280" height="280"/>
  <rect x="412" y="124" width="2" height="344" rx="1" fill="#c9e6f5" opacity="0.42"/>
  <text x="468" y="236" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-2">Hoea tō Waka</text>
  <text x="472" y="298" fill="#a3d9f6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="6">STRENGTH IN AOTEAROA</text>
  <text x="472" y="376" fill="#ffffff" opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="27">Practical resilience training and resources</text>
  <text x="472" y="416" fill="#ffffff" opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="27">for people, teams, and organisations.</text>
  <text x="472" y="494" fill="#ffffff" opacity="0.68" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">HOEATOWAKA.CO.NZ</text>
